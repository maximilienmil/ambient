<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latent · v3</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1e9;--card:#fbfaf6;--ink:#25271e;--muted:#6f7166;--line:#e1ddd2;--gold:#f3d66d;--lilac:#e8dff1;--lilacInk:#5d4a73;--olive:#262d22;--oliveLine:#3b4433;--lime:#d8e980;--a:#e7b93c;--b:#9a7fc0;--c:#7fa58b}
*{box-sizing:border-box}body{margin:0;background:#e9e5da;color:var(--ink);font:15px/1.45 Geist,-apple-system,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible{outline:3px solid #a080bd;outline-offset:2px}
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 24px 64px;flex-wrap:wrap}
.desk{width:min(1180px,100%);height:820px;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #29261c22;border:1px solid #ddd8cb}
.phone{width:402px;height:874px;border-radius:56px;padding:12px;background:#111;box-shadow:0 24px 70px #29261c33;flex:none}
.phone .scr{width:378px;height:850px;border-radius:46px;overflow:hidden;position:relative}
.phone .scr:before{content:"";position:absolute;top:11px;left:50%;translate:-50%;width:124px;height:36px;border-radius:20px;background:#000;z-index:5}
.app{container-type:inline-size;height:100%;background:var(--paper);display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:18px;padding:16px 28px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:.14em;font-size:13px}.tabs{display:flex;gap:4px;margin-left:auto;background:#ebe7dc;border-radius:99px;padding:3px}
.tab{padding:7px 16px;border-radius:99px;font-size:14px;color:var(--muted)}.tab[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001}
.sync{font-size:12px;color:var(--muted)}
.body{flex:1;overflow:auto;padding:28px}
.ptab{display:none}
@container (max-width:600px){.nav{display:none}.body{padding:62px 16px 96px}.ptab{display:flex;position:absolute;left:16px;right:16px;bottom:22px;justify-content:space-around;background:#fffc;backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:99px;padding:6px}.ptab .tab{flex:1;text-align:center}.grid{grid-template-columns:1fr!important}.week{grid-template-columns:repeat(5,1fr)!important}h1{font-size:34px!important}.paths{grid-template-columns:1fr!important}.hide-m{display:none}}
h1{font:400 46px/1.02 "Instrument Serif",serif;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.lede{color:var(--muted);max-width:620px;margin:0 0 22px}
.hero{border-radius:22px;padding:26px;background:radial-gradient(120% 140% at 85% 0%,#fbe9a0 0,#f7e6b9 30%,var(--lilac) 75%);margin-bottom:18px;position:relative;overflow:hidden}
.hero .bees{position:absolute;right:22px;top:18px;font:12px/1.1 ui-monospace,monospace;color:#8a7a3a;white-space:pre;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}.grid>*{min-width:0}
.log{list-style:none;margin:0;padding:0}.log li{display:flex;gap:10px;padding:9px 0;border-top:1px solid #eee9de;font-size:14px}.log li:first-child{border:0}
.st{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:99px;background:#efece3;color:var(--muted);white-space:nowrap;align-self:flex-start}.st.need{background:var(--gold);color:var(--ink)}
.conflict{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 16px}.conflict b{display:block;font-size:26px;font-weight:600}.conflict span{font-size:12px;color:var(--muted)}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.path{text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff}.path[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px #25271e14}
.path .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;margin-right:6px}.path p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.path.sec{opacity:.85}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:118px;font-size:12px}.day b{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.blk{border-radius:8px;padding:5px 6px;margin-bottom:5px;font-size:11.5px;line-height:1.25;transition:all .25s}.rel{background:#fbe7a6}.pre{background:#e5dbf3}.mtg{background:#efece3;color:var(--muted)}.due{border:1.5px dashed #b2563c;color:#8b3b26;background:#fff}
.olive{background:var(--olive);color:#eef0e4;border-radius:18px;padding:18px}.olive h2{color:#b9c0a8}.olive .hrs{font-size:30px;font-weight:600}.olive li{border-color:var(--oliveLine)!important}
.adv{background:var(--lilac);border-radius:18px;padding:18px;color:#2e2538}.adv h3{font:400 26px/1.1 "Instrument Serif",serif;margin:0 0 6px}
.btn{display:inline-block;margin-top:12px;padding:11px 18px;border-radius:99px;background:var(--ink);color:#fff;font-weight:500}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.review{margin-top:12px;background:#fff;border-radius:14px;padding:14px;font-size:14px;display:none}.review.on{display:block}
.review label{display:block;font-size:12px;color:var(--muted);margin-top:8px}.review .f{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfaf6}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.goal{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #eee9de}.goal:first-of-type{border:0}.goal input{font:inherit;border:0;background:none;flex:1;color:var(--ink)}.goal small{color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.pair .card{padding:12px;font-size:14px}.pair small{display:block;color:var(--muted);font-size:12px}
.toast{position:absolute;left:50%;bottom:90px;translate:-50%;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
.app{position:relative}
.demo{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="desk"><div class="app" data-root></div></div>
  <div class="phone"><div class="scr"><div class="app" data-root></div></div></div>
</div>
<script>
const S={tab:'week',path:'A',review:false,merged:false};
const P={
 A:{k:'A',name:'Protect the launch',sub:'Ask Jordan to move the presentation help to Monday. Release ships Friday.',
  days:{Mon:[['mtg','Standup 10:00']],Tue:[['rel','Release 9–12']],Wed:[['mtg','Client call 2:00']],Thu:[['rel','Release 9–12']],Fri:[['due','Release ships']],'Mon 26':[['pre','Jordan deck 9–12']]},
  hrs:'6 of 6 hours',fit:'Release fits. The favor waits for Jordan’s answer.',
  why:'Ask to move the favor, not drop it.',body:'Friday is the date you set for yourself and it needs all six open hours. Monday still lands before Jordan’s Wednesday pitch, so asking costs them little. Until Jordan agrees, nothing is settled.',
  act:'Review the message to Jordan',msg:'Hi Jordan — I want to help with the deck properly, but I’m shipping a release Friday. Could I give you Monday morning instead? Still well before your Wednesday pitch.',eff:'Save draft · hold Tue & Thu 9–12'},
 B:{k:'B',name:'Keep the favor',sub:'Help Jordan by Thursday. Release moves to Monday.',
  days:{Mon:[['mtg','Standup 10:00']],Tue:[['pre','Jordan deck 9–12']],Wed:[['mtg','Client call 2:00']],Thu:[['rel','Release 9–12']],Fri:[['mtg','Release not ready']],'Mon 26':[['rel','Release 9–12'],['due','Release ships']]},
  hrs:'3 of 6 hours',fit:'Release short by 3 hours this week. Ships Monday.',
  why:'Keep your word, move your own date.',body:'If Jordan’s deadline can’t move, your own date is the easier one to shift. Nobody else is waiting on Friday.',
  act:'Review the calendar changes',msg:'Move “Release ships” from Fri Oct 23 to Mon Oct 26. Hold Tue 9–12 for Jordan’s deck.',eff:'Save holds locally'},
 C:{k:'C',name:'Ship smaller',sub:'Keep the favor and ship a smaller release Friday.',
  days:{Mon:[['mtg','Standup 10:00']],Tue:[['pre','Jordan deck 9–12']],Wed:[['mtg','Client call 2:00']],Thu:[['rel','Release 9–12']],Fri:[['due','Small release ships']],'Mon 26':[['rel','Billing + onboarding']]},
  hrs:'3 of 3 hours',fit:'Fits, but billing and onboarding wait a week.',
  why:'Both promises, smaller first release.',body:'Works only if a release without billing and onboarding is still worth shipping. That’s your call, not ours.',
  act:'Review the smaller scope',msg:'Friday: sign-up, core flow, export. Moved to Mon Oct 26: billing, onboarding.',eff:'Save plan locally'}
};
const ic={A:'var(--a)',B:'var(--b)',C:'var(--c)'};
function week(){
 const p=P[S.path];
 const conflict=`<div class="conflict"><div><b>6 h</b><span>release still needs</span></div><div><b>6 h</b><span>open focus time this week</span></div><div><b>−3 h</b><span>new promise to Jordan, by Thu</span></div></div>`;
 return `
 <div class="hero"><div class="bees hide-m">· ⠂ ·  ⠄\n ⠁ · ⠂ ·\n  · ⠄ ·</div>
  <h1>The hive is working through your week.</h1>
  <p class="lede" style="margin:0">Overnight it connected what you said to what’s on your calendar. One thing needs you.</p></div>
 <div class="grid">
  <div class="card">
   <h2>Release Friday, or help Jordan by Thursday?</h2>
   ${conflict}
   <div class="paths">${Object.values(P).map(x=>`<button class="path ${x.k=='C'?'sec':''}" aria-pressed="${S.path==x.k}" data-path="${x.k}"><span class="k" style="background:${ic[x.k]}">${x.k}</span><b>${x.name}</b><p>${x.sub}</p></button>`).join('')}</div>
   <div class="week">${['Mon','Tue','Wed','Thu','Fri','Mon 26'].map(d=>`<div class="day ${d=='Mon 26'?'hide-m':''}"><b>${d=='Mon 26'?'Next Mon':d}</b>${(p.days[d]||[]).map(([c,t])=>`<div class="blk ${c}">${t}</div>`).join('')}</div>`).join('')}</div>
   <p class="note">Synthetic demo week. Hours come from calendar arithmetic, not a model.</p>
  </div>
  <div style="display:grid;gap:18px;align-content:start">
   <div class="olive"><h2>This week with ${p.k}</h2><div class="hrs">${p.hrs}</div><div style="color:#c9cfb9;font-size:14px">${p.fit}</div></div>
   <div class="adv"><h3>${p.why}</h3><div style="font-size:14px">${p.body}</div>
    <button class="btn" data-review>${p.act} →</button>
    <div class="review ${S.review?'on':''}">${p.k=='A'?`<label>To</label><div class="f">jordan@demo.latent</div><label>Message</label>`:'<label>Change</label>'}<div class="f">${p.msg}</div>
     <button class="btn" data-save>${p.eff}</button><p class="note">${p.k=='A'?'A sent request is not Jordan’s agreement. ':''}Nothing leaves this device until you choose Send.</p></div>
   </div>
   <div class="card"><h2>Since 11:42 pm</h2><ul class="log">
    <li>Heard a new promise: “I’ll help with the deck by Thursday.” <span class="st">your voice</span></li>
    <li>Checked it against your release plan. <span class="st need">needs you</span></li>
    <li>Drafted a message to Jordan. <span class="st">not sent</span></li>
    <li>Found 4 to-dos that look like duplicates. <span class="st">in Reconcile</span></li>
   </ul></div>
  </div>
 </div>`;}
function grow(){
 const g=[['Ship the first release','Fri Oct 23 · 6 h left'],['Run three times a week','2 of 3 this week'],['Read before bed','no data yet — tell Bee']];
 return `<h1>What you’re growing toward.</h1><p class="lede">Your goals, in your words. Latent only suggests; you edit.</p>
 <div class="grid"><div class="card"><h2>Goals</h2>${g.map(([a,b])=>`<div class="goal"><input value="${a}" aria-label="Goal"><small>${b}</small></div>`).join('')}<button class="btn ghost">Add a goal</button></div>
 <div style="display:grid;gap:18px;align-content:start">
  <div class="olive"><h2>This month</h2><div class="hrs">~22 h</div><div style="color:#c9cfb9;font-size:14px">open focus time left in October, assuming mornings stay clear. <u>Edit assumption</u></div></div>
  <div class="adv"><h3>A pattern, maybe.</h3><div style="font-size:14px">In the weeks you said yes to two favors, you moved your own work. Is that the trade you want? Tell Latent if this reading is wrong.</div><button class="btn ghost">That’s not right</button></div>
 </div></div>`;}
function rec(){
 return `<h1>Keep what holds up.</h1><p class="lede">Bee writes a to-do each time a conversation mentions it. Some are the same task.</p>
 <div class="card" style="max-width:760px">${S.merged?`<p><b>Merged.</b> “Send Jordan the project outline” kept once; 2 copies retired. <button class="btn ghost" data-undo>Undo</button></p>`:`
 <h2>Likely the same task</h2><div class="pair"><div class="card">Send Jordan the project outline<small>Bee to-do · Tue 10:14 am</small></div><div>≈</div><div class="card">Send outline to Jordan<small>Bee to-do · Thu 4:02 pm</small></div></div>
 <p class="note">Same person, same object, two days apart. Evidence: both conversations mention “the outline.”</p>
 <button class="btn" data-merge>Merge into one</button> <button class="btn ghost">Keep both</button>`}
 </div><p class="note">3 more possible duplicates waiting. Merges are local and reversible.</p>`;}
function render(){
 document.querySelectorAll('[data-root]').forEach(r=>{
  const tabs=[['week','Week'],['grow','Grow'],['rec','Reconcile']].map(([k,l])=>`<button class="tab" aria-selected="${S.tab==k}" data-tab="${k}">${l}</button>`).join('');
  r.innerHTML=`<div class="nav"><span class="logo">LATENT</span><span class="sync">Synced with Bee · 6:58 am</span><div class="tabs">${tabs}</div></div>
  <div class="body">${S.tab=='week'?week():S.tab=='grow'?grow():rec()}</div><div class="ptab">${tabs}</div><div class="toast"></div>`;});
}
function toast(t){document.querySelectorAll('.toast').forEach(x=>{x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1800)})}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){S.tab=d.tab;S.review=false}else if(d.path){S.path=d.path;S.review=false}else if('review'in d){S.review=!S.review}
 else if('save'in d){render();toast('Saved locally · nothing sent');return}else if('merge'in d)S.merged=true;else if('undo'in d)S.merged=false;else return;render()});
render();
</script>
</body>
</html>
